<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <title>Document</title>
    <!-- Link to Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link to custom CSS for additional styles -->
    <link rel="stylesheet" href="style.css">
   <style>
    body{
        font-family: "poppins";
    }
   </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card p-4" style="max-width: 400px; width: 100%;">
            <h2 class="text-center mb-4">Registration form</h2>
            <form id="login-form">
            
                 <div class="alerts"></div>
                 <div class="mb-3">
                    <label for="username" class="form-label">Full name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Enter your fullname" required onkeyup="validateName()">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email" required onkeyup="validateEmail()">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required onkeyup="validatePassword()">
                        <span id="toggle-password" class="position-relative" style="right: 10px; top: 35px; cursor: pointer; color: #0056b3;">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
<input type="checkbox" name="terms" id="terms" style="cursor: pointer;">Accept the terms and conditions
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100">submit</button>

                <!-- Footer Links -->
                <div class="footer-links d-flex justify-content-between mt-3">
                    <a href="forgotpassword.html">Forgot Password?</a>
                    <a href="createAccount.html">Create an Account</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Link to Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- Link to custom JS -->
    <script src="script.js"></script>
   
</body>

</html>
